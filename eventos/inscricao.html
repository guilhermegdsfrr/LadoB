<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição em evento | Lado B</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="eventos.css">

    <style>
        .pagina-inscricao {
            max-width: 560px;
            margin: 60px auto;
            padding: 40px;
            background-color: #fff8ef;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            font-family: Georgia, serif;
            color: #3b2a1e;
        }

        .pagina-inscricao h1 {
            margin-top: 0;
        }

        .aviso-demo {
            font-size: 14px;
            color: #7a6455;
            margin-bottom: 30px;
        }

        .formulario-inscricao label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .formulario-inscricao input,
        .formulario-inscricao select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #c9b8a8;
            border-radius: 6px;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
        }

        .formulario-inscricao button {
            background-color: #4a3728;
            color: #fff;
            border: none;
            padding: 14px 30px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 17px;
            cursor: pointer;
        }

        .formulario-inscricao button:hover {
            background-color: #2f2218;
        }

        .mensagem-sucesso {
            display: none;
            padding: 20px;
            background-color: #e8f3e3;
            border-left: 5px solid #5a8a4a;
            border-radius: 6px;
        }

        .voltar {
            display: inline-block;
            margin-top: 25px;
            color: #4a3728;
        }
    </style>
</head>
<body>

    <main class="pagina-inscricao">
        <h1>Inscrição em evento</h1>
        <p class="aviso-demo">Página de demonstração: nenhum dado é enviado ou salvo.</p>

        <form class="formulario-inscricao" id="formulario">
            <label for="evento">Evento</label>
            <select id="evento" required>
                <option value="">Escolha um evento</option>
                <option>Feira de compra e troca de disco de vinil (19 NOV)</option>
                <option>Disco às cegas (29 NOV)</option>
                <option>Sexta do garimpo (11 DEZ)</option>
                <option>Exposição artística de capas de disco (18 DEZ)</option>
                <option>Oficina de criação de capas de disco (20 DEZ)</option>
                <option>Documentário sobre um álbum escolhido por você! (22 JAN)</option>
            </select>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(11) 99999-9999">

            <button type="submit">Confirmar inscrição</button>
        </form>

        <div class="mensagem-sucesso" id="sucesso">
            <strong>Inscrição confirmada!</strong>
            <p id="texto-sucesso"></p>
        </div>

        <a href="eventos.html" class="voltar">← Voltar para os eventos</a>
    </main>

    <script>
        // Seleciona o evento automaticamente quando vem do botão "Inscrever-se"
        const parametros = new URLSearchParams(window.location.search);
        const numeroEvento = parametros.get("evento");
        if (numeroEvento) {
            document.getElementById("evento").selectedIndex = Number(numeroEvento);
        }

        // Mostra a mensagem de sucesso sem enviar nada (é só demonstração)
        document.getElementById("formulario").addEventListener("submit", function (e) {
            e.preventDefault();
            const nome = document.getElementById("nome").value;
            const evento = document.getElementById("evento").value;

            document.getElementById("texto-sucesso").textContent =
                "Obrigado, " + nome + "! Sua vaga em \"" + evento + "\" está garantida.";

            this.style.display = "none";
            document.getElementById("sucesso").style.display = "block";
        });
    </script>

</body>
</html>
